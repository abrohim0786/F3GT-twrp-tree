name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Upstream OrangeFox Branch - see logs for available values (e.g., fox_14.1, fox_12.1, fox_11.0, main)'
        required: true
        default: 'fox_12.1'
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/abrohim0786/F3GT-twrp-tree.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'ofox-test1'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/xiaomi/ares'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'ares'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build OrangeFox by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Display Inputs
      run: |
        echo "::group::Build Configuration"
        echo "OrangeFox Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "::endgroup::"

    - name: Clean Up Workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Install Build Environment
      run: |
        sudo apt-get update
        sudo apt-get -y upgrade
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: List Available OrangeFox Upstream Branches
      id: list_branches
      run: |
        set -e
        rm -rf OF_sync_tmp
        git clone --depth=1 --no-checkout https://gitlab.com/OrangeFox/sync.git OF_sync_tmp
        cd OF_sync_tmp
        git fetch origin
        echo ">>> Available branches on upstream:"
        git branch -r | sed 's/origin\\///g' | sort | uniq | tee /tmp/fox-branches.txt
        echo "::notice file=sync.repo,line=1::Available OrangeFox branches:"
        cat /tmp/fox-branches.txt | while read br; do echo " - $br"; done
        echo "fox_branch=$(cat /tmp/fox-branches.txt | xargs)">>$GITHUB_OUTPUT

    - name: Set Up Manifest
      run: |
        set -euo pipefail
        BRANCH_NAME="${{ github.event.inputs.MANIFEST_BRANCH }}"
        cd ${GITHUB_WORKSPACE}
        rm -rf OrangeFox
        mkdir -p OrangeFox
        cd OrangeFox
        git config --global user.name "abrohim0786"
        git config --global user.email "callofduty.pubg786@gmail.com"
        git config --global core.filemode false
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        echo ">>> Checking for branch: $BRANCH_NAME"
        git fetch origin
        if git ls-remote --heads origin "$BRANCH_NAME" | grep "$BRANCH_NAME"; then
          git checkout -f $BRANCH_NAME || git checkout -f -b $BRANCH_NAME origin/$BRANCH_NAME
        else
          echo "::error::Branch '$BRANCH_NAME' not found in OrangeFox repo. Here are available branches:"
          git branch -r
          exit 1
        fi
        python3 sync.py --group_https --branch $BRANCH_NAME

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox
        echo "Cloning device tree from ${{ github.event.inputs.DEVICE_TREE }}..."
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} --depth 1 ./${{ github.event.inputs.DEVICE_PATH }}
        echo "✓ Device tree cloned successfully"

    - name: Build OrangeFox Recovery
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox
        echo "::group::Build Environment Setup"
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LUNCHBOX_ALLOW_MISSING_DEPENDENCIES=true
        echo "::endgroup::"
        echo "::group::Building ${{ github.event.inputs.BUILD_TARGET }}.img"
        lunch ${{ github.event.inputs.DEVICE_NAME }}-user || lunch ${{ github.event.inputs.DEVICE_NAME }}-eng
        make clean
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all) 2>&1 | tee build.log
        echo "::endgroup::"

    - name: Generate MD5 Checksum
      if: success()
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        if [ -f ${{ github.event.inputs.BUILD_TARGET }}.img ]; then
          md5sum ${{ github.event.inputs.BUILD_TARGET }}.img > ${{ github.event.inputs.BUILD_TARGET }}.img.md5
          echo "::group::Checksums"
          cat ${{ github.event.inputs.BUILD_TARGET }}.img.md5
          echo "::endgroup::"
        else
          echo "::warning::Build image not found at expected location"
        fi

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
        path: |
          ${{ github.workspace }}/OrangeFox/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          ${{ github.workspace }}/OrangeFox/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img.md5
        retention-days: 30
        if-no-files-found: warn

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      if: success()
      with:
        name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
        path: ./build-output

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
        files: |
          ./build-output/${{ github.event.inputs.BUILD_TARGET }}.img
          ./build-output/${{ github.event.inputs.BUILD_TARGET }}.img.md5
        body: |
          **OrangeFox Recovery Build Success! ✅**
          - **Device**: ${{ github.event.inputs.DEVICE_NAME }}
          - **Branch**: ${{ github.event.inputs.MANIFEST_BRANCH }}
          - **Build Target**: ${{ github.event.inputs.BUILD_TARGET }}
          - **Built by**: ${{ github.actor }}
          - **Build Number**: ${{ github.run_number }}
          - **Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Summary
      if: always()
      run: |
        echo "::group::Build Summary"
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Build completed successfully!"
        else
          echo "❌ Build failed with status: ${{ job.status }}"
        fi
        echo "Run ID: ${{ github.run_id }}"
        echo "Run Number: ${{ github.run_number }}"
        echo "Timestamp: $(date -u)"
        echo "::endgroup::"
